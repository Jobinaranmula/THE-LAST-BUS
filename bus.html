<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>The Last Bus – Kerala Bus Journey</title>

<meta name="description"
      content="The Last Bus – A nostalgic Kerala bus journey with Malayalam songs, rain, nature sounds, bus bell and horn.">

<meta name="robots" content="index, follow">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: "Noto Sans Malayalam", sans-serif;
}

/* FULL SCREEN BUS VIEW */
.bus-world {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;

  background-color: #000;
  background-image: url("bus-interior.png");

  background-size: auto 96%;
  background-position: center center;
  background-repeat: no-repeat;

  animation: busTravel 1.8s ease-in-out infinite;
}

/* BUS MOVEMENT */
@keyframes busTravel {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg);
  }

  25% {
    transform: translate3d(-1px, 1px, 0) rotate(-0.12deg);
  }

  50% {
    transform: translate3d(1px, -1px, 0) rotate(0.10deg);
  }

  75% {
    transform: translate3d(-1px, 0, 0) rotate(-0.08deg);
  }

  100% {
    transform: translate3d(0, 0, 0) rotate(0deg);
  }
}

/* CINEMATIC SHADE */
.bus-world::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.08),
      transparent 30%,
      rgba(0,0,0,0.12)
    );
}

/* TOP */
.top-bar {
  position: absolute;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 16px 18px;
  z-index: 10;

  color: white;
}

.trip-title {
  font-size: 12px;
  letter-spacing: 3px;
  opacity: 0.85;
  text-shadow: 0 2px 8px #000;
}

.fullscreen-btn {
  border: 0;
  background: rgba(255,255,255,0.14);
  color: white;

  width: 42px;
  height: 42px;
  border-radius: 50%;

  font-size: 19px;
  cursor: pointer;

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* CONTROLS */
.controls {
  position: absolute;

  left: 50%;
  bottom: calc(48px + env(safe-area-inset-bottom, 0px));

  transform: translateX(-50%);

  width: min(94%, 650px);

  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;

  z-index: 20;
}

.control-btn {
  min-width: 105px;
  height: 48px;

  padding: 0 16px;

  border: 1px solid rgba(255,255,255,0.30);
  border-radius: 28px;

  background: rgba(20,20,20,0.28);

  color: white;
  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  box-shadow:
    0 5px 20px rgba(0,0,0,0.25);

  transition: transform .15s ease,
              background .2s ease;
}

.control-btn:active {
  transform: scale(0.94);
}

.control-btn.active {
  background: rgba(255,255,255,0.30);
  border-color: rgba(255,255,255,0.65);
}

/* MP3 PLAYER */
.player {
  position: absolute;

  left: 50%;
  bottom: 145px;

  transform: translateX(-50%);

  width: min(92%, 560px);

  padding: 12px 14px;

  display: none;

  align-items: center;
  gap: 8px;

  color: white;

  background: rgba(10,10,10,0.38);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 22px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  z-index: 25;
}

.player.show {
  display: flex;
}

.play-btn {
  width: 44px;
  height: 44px;

  flex: 0 0 44px;

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,0.22);
  color: white;

  font-size: 17px;

  cursor: pointer;
}

.play-btn:active {
  transform: scale(0.92);
}

.song-info {
  flex: 1;
  min-width: 0;

  padding: 0 4px;
}

.song-name {
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-number {
  font-size: 10px;
  opacity: 0.65;
  margin-top: 3px;
}

.volume {
  width: 75px;
}

/* CREDIT */
.credit {
  position: absolute;

  left: 0;
  right: 0;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));

  text-align: center;

  color: white;
  font-size: 12px;
  letter-spacing: 1px;

  text-shadow: 0 2px 8px #000;

  z-index: 30;
}

.credit span {
  opacity: 0.95;
}

/* MOBILE */
@media (max-width: 600px) {

  .bus-world {
    background-size: auto 96%;
    background-position: center center;
  }

  .trip-title {
    font-size: 9px;
    letter-spacing: 2px;
  }

  .fullscreen-btn {
    width: 38px;
    height: 38px;
  }

  .controls {
    bottom: calc(43px + env(safe-area-inset-bottom, 0px));
    gap: 8px;
  }

  .control-btn {
    min-width: 92px;
    height: 44px;
    padding: 0 12px;
    font-size: 12px;
  }

  .player {
    bottom: 142px;
    width: 94%;
    gap: 5px;
    padding: 10px;
  }

  .play-btn {
    width: 40px;
    height: 40px;
    flex-basis: 40px;
  }

  .song-name {
    font-size: 13px;
  }

  .volume {
    width: 62px;
  }

  .credit {
    font-size: 10px;
  }
}

/* LANDSCAPE */
@media (orientation: landscape) {

  .bus-world {
    background-size: auto 96%;
  }

  .controls {
    right: 18px;
    left: auto;
    bottom: 18px;
    transform: none;

    width: auto;
    max-width: 48%;

    justify-content: flex-end;
  }

  .credit {
    bottom: 5px;
  }
}
</style>
</head>

<body>

<div class="bus-world" id="busWorld">

  <!-- TOP -->
  <div class="top-bar">

    <div class="trip-title">
      THE LAST BUS · KERALA JOURNEY
    </div>

    <button class="fullscreen-btn"
            onclick="toggleFullscreen()"
            aria-label="Fullscreen">
      ⛶
    </button>

  </div>


  <!-- MP3 PLAYER -->
  <div class="player" id="player">

    <!-- PREVIOUS -->
    <button class="play-btn"
            onclick="prevSong()"
            aria-label="Previous">
      ⏮
    </button>

    <!-- PLAY / PAUSE -->
    <button class="play-btn"
            id="playBtn"
            onclick="toggleMusic()"
            aria-label="Play">
      ▶
    </button>

    <!-- SONG INFO -->
    <div class="song-info">

      <div class="song-name"
           id="songName">
        പാട്ട് 1
      </div>

      <div class="song-number"
           id="songNumber">
        1 / 7
      </div>

    </div>

    <!-- NEXT -->
    <button class="play-btn"
            onclick="nextSong()"
            aria-label="Next">
      ⏭
    </button>

    <!-- VOLUME -->
    <input class="volume"
           id="musicVolume"
           type="range"
           min="0"
           max="1"
           step="0.01"
           value="0.70">

  </div>


  <!-- CONTROLS -->
  <div class="controls">

    <button class="control-btn"
            id="rainBtn"
            onclick="toggleRain()">
      🌧️ മഴ
    </button>

    <button class="control-btn"
            id="natureBtn"
            onclick="toggleNature()">
      🌿 പ്രകൃതി
    </button>

    <button class="control-btn"
            onclick="showPlayer()">
      🎵 MP3 Player
    </button>

    <button class="control-btn"
            id="bellBtn"
            onclick="playBell()">
      🔔 ബസ് ബെൽ
    </button>

    <button class="control-btn"
            id="hornBtn"
            onclick="playHorn()">
      📯 ഹോൺ
    </button>

  </div>


  <!-- CREDIT -->
  <div class="credit">
    <span>Dedicated by രജിത്ത് ശശി ❣️</span>
  </div>

</div>


<!-- AUDIO -->

<audio id="rainAudio"
       loop
       preload="auto">
</audio>

<audio id="natureAudio"
       loop
       preload="auto">
</audio>

<audio id="musicAudio"
       preload="auto">
</audio>

<audio id="bellAudio"
       preload="auto">
</audio>

<audio id="hornAudio"
       preload="auto">
</audio>


<script>

/* AUDIO ELEMENTS */

const rainAudio =
  document.getElementById("rainAudio");

const natureAudio =
  document.getElementById("natureAudio");

const musicAudio =
  document.getElementById("musicAudio");

const bellAudio =
  document.getElementById("bellAudio");

const hornAudio =
  document.getElementById("hornAudio");


/* BUTTONS */

const rainBtn =
  document.getElementById("rainBtn");

const natureBtn =
  document.getElementById("natureBtn");

const playBtn =
  document.getElementById("playBtn");

const player =
  document.getElementById("player");


/* AUDIO FILES */

rainAudio.src = "rain.mp3";

natureAudio.src = "nature.mp3";

bellAudio.src = "bus-bell.mp3";

hornAudio.src = "bus-horn.mp3";


/* 7 SONG PLAYLIST */

const songs = [

  {
    file: "song1.mp3",
    name: "പാട്ട് 1"
  },

  {
    file: "song2.mp3",
    name: "പാട്ട് 2"
  },

  {
    file: "song3.mp3",
    name: "പാട്ട് 3"
  },

  {
    file: "song4.mp3",
    name: "പാട്ട് 4"
  },

  {
    file: "song5.mp3",
    name: "പാട്ട് 5"
  },

  {
    file: "song6.mp3",
    name: "പാട്ട് 6"
  },

  {
    file: "song7.mp3",
    name: "പാട്ട് 7"
  }

];


let currentSong = 0;


/* VOLUME */

rainAudio.volume = 0.35;

natureAudio.volume = 0.35;

musicAudio.volume = 0.70;


/* LOAD SONG */

function loadSong(index) {

  currentSong = index;

  musicAudio.src =
    songs[currentSong].file;

  document.getElementById("songName")
    .textContent =
    songs[currentSong].name;

  document.getElementById("songNumber")
    .textContent =
    (currentSong + 1) + " / " + songs.length;

}


/* SHOW PLAYER */

function showPlayer() {

  player.classList.toggle("show");

}


/* PLAY / PAUSE */

function toggleMusic() {

  if (musicAudio.paused) {

    musicAudio.play()
      .then(() => {

        playBtn.textContent = "⏸";

      })
      .catch(() => {});

  } else {

    musicAudio.pause();

    playBtn.textContent = "▶";

  }

}


/* NEXT SONG */

function nextSong() {

  currentSong++;

  if (currentSong >= songs.length) {

    currentSong = 0;

  }

  loadSong(currentSong);

  musicAudio.play()
    .then(() => {

      playBtn.textContent = "⏸";

    })
    .catch(() => {});

}


/* PREVIOUS SONG */

function prevSong() {

  currentSong--;

  if (currentSong < 0) {

    currentSong = songs.length - 1;

  }

  loadSong(currentSong);

  musicAudio.play()
    .then(() => {

      playBtn.textContent = "⏸";

    })
    .catch(() => {});

}


/* AUTO NEXT */

musicAudio.addEventListener(
  "ended",
  function() {

    nextSong();

  }
);


/* MUSIC VOLUME */

document.getElementById("musicVolume")
  .addEventListener("input", function() {

    musicAudio.volume = this.value;

  });


/* RAIN */

function toggleRain() {

  if (rainAudio.paused) {

    rainAudio.play()
      .then(() => {

        rainBtn.classList.add("active");

      })
      .catch(() => {});

  } else {

    rainAudio.pause();

    rainBtn.classList.remove("active");

  }

}


/* NATURE */

function toggleNature() {

  if (natureAudio.paused) {

    natureAudio.play()
      .then(() => {

        natureBtn.classList.add("active");

      })
      .catch(() => {});

  } else {

    natureAudio.pause();

    natureBtn.classList.remove("active");

  }

}


/* BUS BELL */

function playBell() {

  bellAudio.currentTime = 0;

  bellAudio.play()
    .catch(() => {});

}


/* BUS HORN */

function playHorn() {

  hornAudio.currentTime = 0;

  hornAudio.play()
    .catch(() => {});

}


/* FULLSCREEN */

function toggleFullscreen() {

  if (!document.fullscreenElement) {

    document.documentElement
      .requestFullscreen()
      .catch(() => {});

  } else {

    document.exitFullscreen();

  }

}


/* FIRST SONG */

loadSong(0);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>The Last Bus</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: "Noto Sans Malayalam", sans-serif;
}

/* FULL SCREEN BUS VIEW */
.bus-world {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;

  background-color: #000;
  background-image: url("bus-interior.png");

  /* ചെറിയ ZOOM OUT */
  background-size: auto 96%;
  background-position: center center;
  background-repeat: no-repeat;

  animation: busTravel 1.8s ease-in-out infinite;
}

/* ചെറിയ bus movement */
@keyframes busTravel {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg);
  }

  25% {
    transform: translate3d(-1px, 1px, 0) rotate(-0.12deg);
  }

  50% {
    transform: translate3d(1px, -1px, 0) rotate(0.10deg);
  }

  75% {
    transform: translate3d(-1px, 0, 0) rotate(-0.08deg);
  }

  100% {
    transform: translate3d(0, 0, 0) rotate(0deg);
  }
}

/* cinematic shade */
.bus-world::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.08),
      transparent 30%,
      rgba(0,0,0,0.12)
    );
}

/* TOP */
.top-bar {
  position: absolute;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 16px 18px;
  z-index: 10;

  color: white;
}

.trip-title {
  font-size: 12px;
  letter-spacing: 3px;
  opacity: 0.85;
  text-shadow: 0 2px 8px #000;
}

.fullscreen-btn {
  border: 0;
  background: rgba(255,255,255,0.14);
  color: white;

  width: 42px;
  height: 42px;
  border-radius: 50%;

  font-size: 19px;
  cursor: pointer;

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* CONTROLS */
.controls {
  position: absolute;

  left: 50%;
  bottom: calc(48px + env(safe-area-inset-bottom, 0px));

  transform: translateX(-50%);

  width: min(94%, 650px);

  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;

  z-index: 20;
}

.control-btn {
  min-width: 105px;
  height: 48px;

  padding: 0 16px;

  border: 1px solid rgba(255,255,255,0.30);
  border-radius: 28px;

  background: rgba(20,20,20,0.28);

  color: white;
  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  box-shadow:
    0 5px 20px rgba(0,0,0,0.25);

  transition: transform .15s ease,
              background .2s ease;
}

.control-btn:active {
  transform: scale(0.94);
}

.control-btn.active {
  background: rgba(255,255,255,0.30);
  border-color: rgba(255,255,255,0.65);
}

/* MP3 PLAYER */
.player {
  position: absolute;

  left: 50%;
  bottom: 145px;

  transform: translateX(-50%);

  width: min(90%, 500px);

  padding: 12px 16px;

  display: none;

  align-items: center;
  gap: 12px;

  color: white;

  background: rgba(10,10,10,0.32);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 22px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  z-index: 25;
}

.player.show {
  display: flex;
}

.play-btn {
  width: 44px;
  height: 44px;

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,0.22);
  color: white;

  font-size: 18px;
}

.song-info {
  flex: 1;
  min-width: 0;
}

.song-name {
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.volume {
  width: 85px;
}

/* CREDIT */
.credit {
  position: absolute;

  left: 0;
  right: 0;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));

  text-align: center;

  color: white;
  font-size: 12px;
  letter-spacing: 1px;

  text-shadow: 0 2px 8px #000;

  z-index: 30;
}

.credit span {
  opacity: 0.95;
}

/* MOBILE */
@media (max-width: 600px) {

  .bus-world {
    background-size: auto 96%;
    background-position: center center;
  }

  .trip-title {
    font-size: 9px;
    letter-spacing: 2px;
  }

  .fullscreen-btn {
    width: 38px;
    height: 38px;
  }

  .controls {
    bottom: calc(43px + env(safe-area-inset-bottom, 0px));
    gap: 8px;
  }

  .control-btn {
    min-width: 92px;
    height: 44px;
    padding: 0 12px;
    font-size: 12px;
  }

  .player {
    bottom: 142px;
    width: 92%;
  }

  .credit {
    font-size: 10px;
  }
}

/* LANDSCAPE */
@media (orientation: landscape) {

  .bus-world {
    background-size: auto 96%;
  }

  .controls {
    right: 18px;
    left: auto;
    bottom: 18px;
    transform: none;

    width: auto;
    max-width: 48%;

    justify-content: flex-end;
  }

  .credit {
    bottom: 5px;
  }
}
</style>
</head>

<body>

<div class="bus-world" id="busWorld">

  <!-- TOP -->
  <div class="top-bar">
    <div class="trip-title">
      THE LAST BUS · KERALA JOURNEY
    </div>

    <button class="fullscreen-btn"
            onclick="toggleFullscreen()"
            aria-label="Fullscreen">
      ⛶
    </button>
  </div>

  <!-- MP3 PLAYER -->
  <div class="player" id="player">

    <button class="play-btn"
            id="playBtn"
            onclick="toggleMusic()">
      ▶
    </button>

    <div class="song-info">
      <div class="song-name" id="songName">
        യാത്രാ സംഗീതം
      </div>
    </div>

    <input class="volume"
           id="musicVolume"
           type="range"
           min="0"
           max="1"
           step="0.01"
           value="0.7">

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <button class="control-btn"
            id="rainBtn"
            onclick="toggleRain()">
      🌧️ മഴ
    </button>

    <button class="control-btn"
            id="natureBtn"
            onclick="toggleNature()">
      🌿 പ്രകൃതി
    </button>

    <button class="control-btn"
            onclick="showPlayer()">
      🎵 MP3 Player
    </button>

    <button class="control-btn"
            id="bellBtn"
            onclick="playBell()">
      🔔 ബസ് ബെൽ
    </button>

    <button class="control-btn"
            id="hornBtn"
            onclick="playHorn()">
      📯 ഹോൺ
    </button>

  </div>

  <!-- CREDIT -->
  <div class="credit">
    <span>Dedicated by രജിത്ത് ശശി ❣️</span>
  </div>

</div>

<!-- AUDIO -->
<audio id="rainAudio"
       loop
       preload="auto">
</audio>

<audio id="natureAudio"
       loop
       preload="auto">
</audio>

<audio id="musicAudio"
       preload="auto">
</audio>

<audio id="bellAudio"
       preload="auto">
</audio>

<audio id="hornAudio"
       preload="auto">
</audio>

<script>

const rainAudio = document.getElementById("rainAudio");
const natureAudio = document.getElementById("natureAudio");
const musicAudio = document.getElementById("musicAudio");
const bellAudio = document.getElementById("bellAudio");
const hornAudio = document.getElementById("hornAudio");

const rainBtn = document.getElementById("rainBtn");
const natureBtn = document.getElementById("natureBtn");
const playBtn = document.getElementById("playBtn");

const player = document.getElementById("player");

/* AUDIO FILES */

rainAudio.src = "rain.mp3";
natureAudio.src = "nature.mp3";
musicAudio.src = "travel.mp3";
bellAudio.src = "bus-bell.mp3";
hornAudio.src = "bus-horn.mp3";

/* VOLUME */

rainAudio.volume = 0.35;
natureAudio.volume = 0.35;
musicAudio.volume = 0.70;

/* RAIN */

function toggleRain() {

  if (rainAudio.paused) {

    rainAudio.play()
      .then(() => {
        rainBtn.classList.add("active");
      })
      .catch(() => {});

  } else {

    rainAudio.pause();
    rainBtn.classList.remove("active");

  }
}

/* NATURE */

function toggleNature() {

  if (natureAudio.paused) {

    natureAudio.play()
      .then(() => {
        natureBtn.classList.add("active");
      })
      .catch(() => {});

  } else {

    natureAudio.pause();
    natureBtn.classList.remove("active");

  }
}

/* MP3 PLAYER */

function showPlayer() {
  player.classList.toggle("show");
}

/* MUSIC */

function toggleMusic() {

  if (musicAudio.paused) {

    musicAudio.play()
      .then(() => {
        playBtn.textContent = "⏸";
      })
      .catch(() => {});

  } else {

    musicAudio.pause();
    playBtn.textContent = "▶";

  }
}

/* MUSIC VOLUME */

document.getElementById("musicVolume")
.addEventListener("input", function() {

  musicAudio.volume = this.value;

});

/* BUS BELL */

function playBell() {

  bellAudio.currentTime = 0;

  bellAudio.play()
    .catch(() => {});

}

/* HORN */

function playHorn() {

  hornAudio.currentTime = 0;

  hornAudio.play()
    .catch(() => {});

}

/* FULLSCREEN */

function toggleFullscreen() {

  if (!document.fullscreenElement) {

    document.documentElement
      .requestFullscreen()
      .catch(() => {});

  } else {

    document.exitFullscreen();

  }

}

</script>

</body>
</html>
